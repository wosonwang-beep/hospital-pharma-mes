<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据字典页面设计原型</title><link rel="stylesheet" href="数据字典-设计.css"></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><span class="mark">✚</span><div><strong>医院制剂管理系统</strong><small>Hospital Pharma MES</small></div></div><div class="nav"><div class="navlabel">导航菜单</div><div class="navgroup">⌂　首页</div><div class="navgroup">▤　基础管理 <b>⌄</b></div><div class="navgroup activeparent">▣　系统管理 <b>⌄</b></div><div class="navitem">部门管理</div><div class="navitem">用户管理</div><div class="navitem">菜单管理</div><div class="navitem">角色管理</div><div class="navitem">角色权限</div><div class="navitem selected">数据字典</div></div></aside><div class="main"><header class="topbar"><span class="crumb">首页　/　系统管理　/　<span id="crumb">数据字典</span></span><div class="topactions"><span class="search">⌕　搜索菜单...</span><span class="circle">?</span><span class="avatar">管</span><span>系统管理员⌄</span></div></header><section class="workspace" id="workspace"></section></div></div>
<script>
const scene=new URLSearchParams(location.search).get('scene')||'list';
const templates={
 list:`<div class="pagehead"><div><h1>数据字典</h1></div><button class="primary" onclick="location.search='?scene=create'">＋ 新增字典</button></div>
 <section class="card"><div class="ctitle">查询条件</div><div class="filters"><label>字典名称<input placeholder="请输入字典名称" value=""></label><label>字典编码<input placeholder="请输入字典编码"></label><label>状态<select><option>全部状态</option><option>启用</option><option>停用</option></select></label><div class="filteractions"><button class="plain">重置</button><button class="primary">查询</button></div></div></section>
 <section class="card datacard"><div class="tablehead"><strong>字典列表</strong><span>共 3 条字典类型</span></div><table><thead><tr><th>字典名称</th><th>字典编码</th><th>选项数量</th><th>状态</th><th>排序</th><th>操作</th></tr></thead><tbody><tr><td><b>设备类型</b></td><td class="mono">EQUIPMENT_TYPE</td><td>6</td><td><span class="pill ok">● 启用</span></td><td>10</td><td class="actions"><a href="?scene=view">查看</a><a href="?scene=edit">编辑</a><a href="?scene=items">配置字典项</a></td></tr><tr><td><b>物料类型</b></td><td class="mono">MATERIAL_TYPE</td><td>5</td><td><span class="pill ok">● 启用</span></td><td>20</td><td class="actions"><a href="?scene=view">查看</a><a href="?scene=edit">编辑</a><a href="?scene=items">配置字典项</a></td></tr><tr><td><b>存储环境</b></td><td class="mono">STORAGE_ENVIRONMENT</td><td>4</td><td><span class="pill muted">● 停用</span></td><td>30</td><td class="actions"><a href="?scene=view">查看</a><a href="?scene=edit">编辑</a><a href="?scene=items">配置字典项</a></td></tr></tbody></table><div class="pager">显示 1 - 3 条　　<span class="page">1</span></div></section>`,
 create:`<div class="pagehead"><div><a class="back" href="?scene=list">← 返回字典列表</a><h1>新增数据字典</h1><p>先创建字典类型，再维护字典选项</p></div></div><section class="card editing"><div class="ctitle">字典基本信息</div><div class="formgrid"><label><span>字典名称 <i>*</i></span><input placeholder="如：设备类型"></label><label><span>字典编码 <i>*</i></span><input placeholder="如：EQUIPMENT_TYPE"></label><label>显示排序<input value="10" type="number"></label><label>字典状态<select><option>启用</option><option>停用</option></select></label><label class="span2">说明<textarea placeholder="请输入该字典的使用范围及含义"></textarea></label></div></section><div class="footbar"><button class="plain" onclick="location.search='?scene=list'">取消</button><button class="primary">保存字典类型</button></div>`,
 edit:`<div class="pagehead"><div><a class="back" href="?scene=list">← 返回字典列表</a><h1>编辑数据字典</h1><p>设备类型　<span class="pill ok">● 启用</span></p></div><button class="plain" onclick="location.search='?scene=items'">维护字典选项 →</button></div><section class="card editing"><div class="ctitle">字典基本信息</div><div class="formgrid"><label><span>字典名称 <i>*</i></span><input value="设备类型"></label><label>字典编码<input value="EQUIPMENT_TYPE" disabled></label><label>显示排序<input value="10" type="number"></label><label>字典状态<select><option>启用</option><option>停用</option></select></label><label class="span2">说明<textarea>设备主数据所使用的设备类型选项。</textarea></label></div></section><section class="info">ⓘ 字典编码被业务使用后不可直接修改，避免历史数据失去对应关系。</section><div class="footbar"><button class="plain" onclick="location.search='?scene=list'">取消</button><button class="primary">保存修改</button></div>`,
 view:`<div class="pagehead"><div><a class="back" href="?scene=list">← 返回字典列表</a><h1>数据字典详情</h1><p>设备类型 <span class="pill ok">● 启用</span></p></div><button class="primary" onclick="location.search='?scene=edit'">编辑字典</button></div><section class="card"><div class="ctitle">基本信息</div><div class="details"><div><small>字典名称</small><strong>设备类型</strong></div><div><small>字典编码</small><strong class="mono">EQUIPMENT_TYPE</strong></div><div><small>字典状态</small><strong>启用</strong></div><div><small>排序</small><strong>10</strong></div><div class="span2"><small>说明</small><strong>设备主数据所使用的设备类型选项。</strong></div></div></section><section class="card datacard"><div class="tablehead"><strong>字典选项</strong><button class="primary" onclick="location.search='?scene=items'">配置字典项</button></div><table><thead><tr><th>选项名称</th><th>选项编码</th><th>排序</th><th>状态</th><th>默认值</th></tr></thead><tbody><tr><td>均质设备</td><td class="mono">HOMOGENIZER</td><td>10</td><td><span class="pill ok">● 启用</span></td><td>否</td></tr><tr><td>混合设备</td><td class="mono">MIXER</td><td>20</td><td><span class="pill ok">● 启用</span></td><td>否</td></tr><tr><td>称量设备</td><td class="mono">SCALE</td><td>30</td><td><span class="pill ok">● 启用</span></td><td>否</td></tr></tbody></table></section>`,
 items:`<div class="pagehead"><div><a class="back" href="?scene=list">← 返回字典列表</a><h1>设备类型 · 字典项配置</h1><p>字典编码 <span class="mono">EQUIPMENT_TYPE</span>　 <span class="pill ok">● 启用</span></p></div><button class="primary" onclick="document.querySelector('.itemeditor').style.display='block'">＋ 新增选项</button></div><div class="twocol"><section class="card datacard"><div class="tablehead"><strong>字典项列表</strong><span>支持排序、停用及默认值配置</span></div><table><thead><tr><th>字典项名称</th><th>编码</th><th>排序</th><th>状态</th><th>操作</th></tr></thead><tbody><tr class="highlight"><td>均质设备</td><td class="mono">HOMOGENIZER</td><td>10</td><td><span class="pill ok">● 启用</span></td><td class="actions"><a>编辑</a><a>停用</a></td></tr><tr><td>混合设备</td><td class="mono">MIXER</td><td>20</td><td><span class="pill ok">● 启用</span></td><td class="actions"><a>编辑</a><a>停用</a></td></tr><tr><td>称量设备</td><td class="mono">SCALE</td><td>30</td><td><span class="pill ok">● 启用</span></td><td class="actions"><a>编辑</a><a>停用</a></td></tr><tr><td>包装设备</td><td class="mono">PACKAGING</td><td>40</td><td><span class="pill muted">● 停用</span></td><td class="actions"><a>编辑</a><a>启用</a></td></tr></tbody></table></section><section class="card itemeditor"><div class="ctitle">编辑字典项</div><div class="formstack"><label><span>选项名称 <i>*</i></span><input value="均质设备"></label><label><span>选项编码 <i>*</i></span><input value="HOMOGENIZER" disabled></label><label>排序<input value="10"></label><label>状态<select><option>启用</option><option>停用</option></select></label><label class="switch"><input type="checkbox">设为默认值</label><label>说明<textarea>用于选择均质类生产设备</textarea></label><div class="editoractions"><button class="plain">取消</button><button class="primary">保存选项</button></div></div></section></div><section class="info">ⓘ 字典项编码保存后保持稳定；停用选项不再供新业务选择，历史业务记录依然展示原值。</section>`
};
document.getElementById('workspace').innerHTML=templates[scene]||templates.list;
document.getElementById('crumb').textContent=scene==='list'?'数据字典':scene==='items'?'字典项配置':'数据字典 / '+({create:'新增',edit:'编辑',view:'详情'}[scene]||'');
</script><div class="watermark">设计原型示例数据 · 尚未创建数据库字典模块</div></body></html>
