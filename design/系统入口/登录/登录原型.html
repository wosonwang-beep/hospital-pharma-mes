<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · PC 页面设计图</title><link rel="stylesheet" href="./登录.css"></head>
<body><main class="login-shell" style="--login-bg:url('../../../frontend/mes-web/src/assets/login/blue-wave-background.png')"><section class="login-left"><div class="login-brand"><img src="../../../frontend/mes-web/src/assets/login/hospital-flower-mark.png" alt="">医院制剂生产管理系统</div><div class="login-message"><div class="login-overline">HOSPITAL PHARMA · MES</div><h1>让每一批制剂<br><span>生产有据可循</span></h1><p class="login-summary">规范生产流程，连接仓储与质量管理。<br>让每个环节清晰可见、全程可追溯。</p><div class="login-traits"><span>生产执行</span><span>质量管理</span><span>批次追溯</span></div></div><div class="login-foot">GMP · 标准化管理 · 可追溯执行</div></section><section class="login-right"><div class="login-panel"><h2 class="login-panel-heading">欢迎登录</h2><p class="login-panel-description">使用您的系统账号访问管理工作台</p><form class="login-form"><label class="login-label" for="login-name">登录账号</label><div class="login-input-wrap"><input id="login-name" class="login-input" placeholder="请输入账号" autocomplete="username"></div><label class="login-label" for="login-password">登录密码</label><div class="login-input-wrap"><input id="login-password" class="login-input is-password" type="password" placeholder="请输入密码" autocomplete="current-password"><button class="login-visibility" type="button">显示</button></div><button type="button" class="login-submit">登 录</button><div class="login-error"> </div></form><div class="login-help">仅授权人员可访问系统业务功能</div></div></section></main></body></html>
