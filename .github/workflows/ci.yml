name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test Maven reactor
        run: mvn -B -ntp test
      - name: Upload Maven reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 3

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mes-web
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/mes-web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test -- --run
      - name: Type check
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  infrastructure-integration:
    name: MariaDB and Redis integration
    runs-on: ubuntu-latest
    env:
      MES_DB_URL: jdbc:mariadb://127.0.0.1:3306/hospital_pharma_mes
      MES_DB_USERNAME: mes
      MES_DB_PASSWORD: ci_database_password
      MES_REDIS_HOST: 127.0.0.1
      MES_REDIS_PORT: '6379'
      MES_REDIS_PASSWORD: ci_redis_password
    services:
      mariadb:
        image: mariadb:11.8.9-noble
        env:
          MARIADB_DATABASE: hospital_pharma_mes
          MARIADB_USER: mes
          MARIADB_PASSWORD: ci_database_password
          MARIADB_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.2.9-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping | grep PONG || redis-cli -a ci_redis_password ping | grep PONG"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Require Redis authentication
        env:
          REDIS_CONTAINER_ID: ${{ job.services.redis.id }}
        run: |
          docker exec "$REDIS_CONTAINER_ID" redis-cli CONFIG SET requirepass "$MES_REDIS_PASSWORD" > /dev/null
          docker exec "$REDIS_CONTAINER_ID" redis-cli -a "$MES_REDIS_PASSWORD" ping > /dev/null
      - name: Run infrastructure integration tests
        run: mvn -B -ntp -Pci-integration verify
      - name: Upload Maven reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: infrastructure-test-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 3

  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify repository and Compose contracts
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-repository.ps1
      - name: Verify CI policy
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-ci.ps1
      - name: Check CI policy rejects unsafe changes
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/verify-ci.Tests.ps1
