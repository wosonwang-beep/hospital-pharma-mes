spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: hospital-pharma-mes
springdoc:
  # Nested command classes share names such as Create/Update; keep their schemas distinct.
  use-fqn: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
mes:
  security:
    jwt:
      active-kid: ${MES_JWT_KID:}
      keys: ${MES_JWT_KEYS:}
