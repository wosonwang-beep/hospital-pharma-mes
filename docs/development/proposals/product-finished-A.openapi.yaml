# SUPERSEDED A DRAFT - DO NOT APPLY. Approved model B: docs/development/decisions/PRODUCT_FINISHED_DIRECT_BATCH_B_20261011.md. Full OpenAPI reconciliation NOT COMPLETE; task BLOCKED.
openapi: 3.1.0
info:
  title: Product finished bounded supplement
  version: DCP-PRODUCT-FINISHED-ROOT-001
  description: |
    Supplements v1.0.23 only in the approved product-finished scope.
    Routes, permissions, signatures and existing states remain unchanged.
    Legacy material lot / ledger identifiers retain their original meaning.
    Derived product identity must never be accepted in a plan command.
paths:
  /api/v1/quality/production-plans:
    post:
      operationId: createProductProductionPlan
      x-permission: qms:plan:create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanCreateV2'}
      responses:
        '201': {description: Created plan with server-derived product identity}
        '400': {description: Unknown field or invalid command shape}
        '409': {description: Wrong batch state or standard subject/product/signature}
  /api/v1/quality/production-plans/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    put:
      operationId: editProductProductionPlan
      x-permission: qms:plan:update
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanUpdateV2'}
      responses:
        '200': {description: Updated draft; batch identity unchanged}
        '400': {description: Client productId or finishedMaterialId rejected}
        '409': {description: Frozen plan or stale optimistic version}
    get:
      operationId: readProductionPlanCompatibly
      x-permission: qms:plan:view
      responses:
        '200':
          description: Original V1 projection or explicit V2 product projection
  /api/v1/quality/production-plans/{id}/approve:
    parameters:
      - {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    post:
      operationId: approveProductProductionPlan
      x-permission: qms:plan:approve
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovePlan'}
      responses:
        '200': {description: Independent signed approval and frozen product/standard}
        '409': {description: Product changed or standard does not match the locked batch}
  /api/v1/quality/specifications:
    get:
      operationId: listQcSpecificationSubjects
      x-permission: qms:specification:view
      parameters:
        - {name: materialId, in: query, schema: {$ref: '#/components/schemas/Id'}}
        - {name: productId, in: query, schema: {$ref: '#/components/schemas/Id'}}
        - {name: subjectType, in: query, schema: {enum: [MATERIAL, PRODUCT]}}
        - {name: versionStatus, in: query, schema: {enum: [DRAFT, APPROVED, RETIRED]}}
      responses:
        '200': {description: Existing server pagination; mutually exclusive subject filters}
        '400': {description: Conflicting subject filters}
    post:
      operationId: createQcSpecificationSubject
      x-permission: qms:specification:create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateQcSpecification'}
      responses:
        '201': {description: Immutable material or product subject root}
        '400': {description: Unknown subject or nonexclusive IDs}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"(0|[1-9][0-9]*)"$'}
  schemas:
    Id: {type: string, pattern: '^[1-9][0-9]*$'}
    Reason: {type: string, minLength: 1, maxLength: 1000}
    PlanCreateV2:
      type: object
      additionalProperties: false
      required: [mainBatchId, qcSpecificationVersionId, balanceRules, reason]
      properties:
        mainBatchId: {$ref: '#/components/schemas/Id'}
        qcSpecificationVersionId: {$ref: '#/components/schemas/Id'}
        balanceRules: {type: array, minItems: 1, maxItems: 1000, items: {type: object}}
        reason: {$ref: '#/components/schemas/Reason'}
    PlanUpdateV2:
      type: object
      additionalProperties: false
      required: [mainBatchId, qcSpecificationVersionId, balanceRules, reason, versionNo]
      properties:
        mainBatchId: {$ref: '#/components/schemas/Id'}
        qcSpecificationVersionId: {$ref: '#/components/schemas/Id'}
        balanceRules: {type: array, minItems: 1, maxItems: 1000, items: {type: object}}
        reason: {$ref: '#/components/schemas/Reason'}
        versionNo: {type: integer, minimum: 0}
    ApprovePlan:
      type: object
      additionalProperties: false
      required: [versionNo, reason, signature]
      properties:
        versionNo: {type: integer, minimum: 0}
        reason: {$ref: '#/components/schemas/Reason'}
        signature:
          type: object
          additionalProperties: false
          required: [reauthToken]
          properties: {reauthToken: {type: string, minLength: 1, writeOnly: true}}
    CreateQcSpecification:
      type: object
      additionalProperties: false
      required: [specificationCode, specificationName, reason]
      properties:
        subjectType: {enum: [MATERIAL, PRODUCT], default: MATERIAL}
        materialId: {$ref: '#/components/schemas/Id'}
        productId: {$ref: '#/components/schemas/Id'}
        specificationCode: {type: string, minLength: 1, maxLength: 100}
        specificationName: {type: string, minLength: 1, maxLength: 200}
        reason: {$ref: '#/components/schemas/Reason'}
      oneOf:
        - required: [materialId]
          properties: {subjectType: {const: MATERIAL}}
          not: {required: [productId]}
        - required: [subjectType, productId]
          properties: {subjectType: {const: PRODUCT}}
          not: {required: [materialId]}
    ProductPlanIdentity:
      type: object
      required: [planSchemaVersion, mainBatchId, productId, inspectionObjectType, inspectionObjectId]
      properties:
        planSchemaVersion: {const: 2}
        mainBatchId: {$ref: '#/components/schemas/Id'}
        productId: {type: string, readOnly: true}
        inspectionObjectType: {const: FINISHED_PRODUCT, readOnly: true}
        inspectionObjectId: {type: string, readOnly: true}
        productSnapshot: {type: object, readOnly: true}
        finishedProductLotId: {type: string, readOnly: true}
        finishedLedgerId: {type: string, readOnly: true}
