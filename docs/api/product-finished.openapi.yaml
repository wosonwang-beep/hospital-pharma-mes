  "components": {
    "parameters": {
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 1
        }
      },
      "IfMatch": {
        "name": "If-Match",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^\"(0|[1-9][0-9]*)\"$"
        }
      }
    },
    "schemas": {
      "Id": {
        "type": "string",
        "pattern": "^[1-9][0-9]*$"
      },
      "Reason": {
        "type": "string",
        "minLength": 1,
        "maxLength": 1000
      },
      "Version": {
        "type": "integer",
        "minimum": 0
      },
      "Decimal": {
        "type": "string",
        "pattern": "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,6})?$"
      },
      "Signature": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "reauthToken"
        ],
        "properties": {
          "reauthToken": {
            "type": "string",
            "minLength": 1,
            "writeOnly": true
          }
        }
      },
      "InstructionCreate": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "batchNo",
          "productId",
          "plannedQty",
          "unitId",
          "reason"
        ],
        "properties": {
          "batchNo": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "productId": {
            "$ref": "#/components/schemas/Id"
          },
          "plannedQty": {
            "$ref": "#/components/schemas/Decimal"
          },
          "unitId": {
            "$ref": "#/components/schemas/Id"
          },
          "plannedDate": {
            "type": "string",
            "format": "date"
          },
          "reason": {
            "$ref": "#/components/schemas/Reason"
          },
          "subBatchPlan": {
            "type": "array",
            "maxItems": 1000,
            "items": {
              "type": "object",
              "description": "Existing bounded SubBatch command contract; no internal Order ID."
            }
          }
        }
      },
      "InstructionUpdate": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "batchNo",
          "productId",
          "plannedQty",
          "unitId",
          "reason",
          "versionNo"
        ],
        "properties": {
          "batchNo": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "productId": {
            "$ref": "#/components/schemas/Id"
          },
          "plannedQty": {
            "$ref": "#/components/schemas/Decimal"
          },
          "unitId": {
            "$ref": "#/components/schemas/Id"
          },
          "plannedDate": {
            "type": "string",
            "format": "date"
          },
          "reason": {
            "$ref": "#/components/schemas/Reason"
          },
          "versionNo": {
            "$ref": "#/components/schemas/Version"
          }
        }
      },
      "PlanCreateV2": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "mainBatchId",
          "qcSpecificationVersionId",
          "balanceRules",
          "reason"
        ],
        "properties": {
          "mainBatchId": {
            "$ref": "#/components/schemas/Id"
          },
          "qcSpecificationVersionId": {
            "$ref": "#/components/schemas/Id"
          },
          "balanceRules": {
            "type": "array",
            "minItems": 1,
            "maxItems": 1000,
            "items": {
              "type": "object",
              "description": "Existing bounded BalanceRule / non-executable expression DSL contract."
            }
          },
          "reason": {
            "$ref": "#/components/schemas/Reason"
          }
        }
      },
      "PlanUpdateV2": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "mainBatchId",
          "qcSpecificationVersionId",
          "balanceRules",
          "reason",
          "versionNo"
        ],
        "properties": {
          "mainBatchId": {
            "$ref": "#/components/schemas/Id"
          },
          "qcSpecificationVersionId": {
            "$ref": "#/components/schemas/Id"
          },
          "balanceRules": {
            "type": "array",
            "minItems": 1,
            "maxItems": 1000,
            "items": {
              "type": "object",
              "description": "Existing bounded BalanceRule / non-executable expression DSL contract."
            }
          },
          "reason": {
            "$ref": "#/components/schemas/Reason"
          },
          "versionNo": {
            "$ref": "#/components/schemas/Version"
          }
        }
      },
      "ApprovePlan": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "versionNo",
          "reason",
          "signature"
        ],
        "properties": {
          "versionNo": {
            "$ref": "#/components/schemas/Version"
          },
          "reason": {
            "$ref": "#/components/schemas/Reason"
          },
          "signature": {
            "$ref": "#/components/schemas/Signature"
          }
        }
      },
      "CreateQcSpecification": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "specificationCode",
          "specificationName",
          "reason"
        ],
        "properties": {
          "subjectType": {
            "enum": [
              "MATERIAL",
              "PRODUCT"
            ],
            "default": "MATERIAL"
          },
          "materialId": {
            "$ref": "#/components/schemas/Id"
          },
          "productId": {
            "$ref": "#/components/schemas/Id"
          },
          "specificationCode": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "specificationName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "reason": {
            "$ref": "#/components/schemas/Reason"
          }
        },
        "oneOf": [
          {
            "required": [
              "materialId"
            ],
            "properties": {
              "subjectType": {
                "const": "MATERIAL"
              }
            },
            "not": {
              "required": [
                "productId"
              ]
            }
          },
          {
            "required": [
              "subjectType",
              "productId"
            ],
            "properties": {
              "subjectType": {
                "const": "PRODUCT"
              }
            },
            "not": {
              "required": [
                "materialId"
              ]
            }
          }
        ]
      },
      "ProductPlanIdentity": {
        "type": "object",
        "required": [
          "planSchemaVersion",
          "mainBatchId",
          "productId",
          "inspectionObjectType",
          "inspectionObjectId"
        ],
        "properties": {
          "planSchemaVersion": {
            "const": 2
          },
          "mainBatchId": {
            "$ref": "#/components/schemas/Id"
          },
          "productId": {
            "type": "string",
            "pattern": "^[1-9][0-9]*$",
            "readOnly": true
          },
          "inspectionObjectType": {
            "const": "FINISHED_PRODUCT",
            "readOnly": true
          },
          "inspectionObjectId": {
            "type": "string",
            "pattern": "^[1-9][0-9]*$",
            "readOnly": true
          },
          "productSnapshot": {
            "type": "object",
            "readOnly": true
          }
        }
      },
      "ProductOutput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "versionNo",
          "eventType",
          "amount",
          "unitId",
          "sourceRef",
          "locationId",
          "productionDate",
          "expiryDate",
          "reason",
          "signature"
        ],
        "properties": {
          "versionNo": {
            "$ref": "#/components/schemas/Version"
          },
          "eventType": {
            "const": "OUTPUT"
          },
          "operationExecutionId": {
            "$ref": "#/components/schemas/Id"
          },
          "amount": {
            "$ref": "#/components/schemas/Decimal"
          },
          "unitId": {
            "$ref": "#/components/schemas/Id"
          },
          "sourceRef": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "locationId": {
            "$ref": "#/components/schemas/Id"
          },
          "productionDate": {
            "type": "string",
            "format": "date"
          },
          "expiryDate": {
            "type": "string",
            "format": "date"
          },
          "reason": {
            "$ref": "#/components/schemas/Reason"
          },
          "signature": {
            "$ref": "#/components/schemas/Signature"
          }
        }
      },
      "FinishedInboundCreate": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "requestNo",
          "mainBatchId",
          "reason"
        ],
        "properties": {
          "requestNo": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "mainBatchId": {
            "$ref": "#/components/schemas/Id"
          },
          "reason": {
            "$ref": "#/components/schemas/Reason"
          },
          "createInspectionDraft": {
            "type": "boolean"
          },
          "inspectionRequestNo": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          }
        }
      },
      "FinishedInboundConfirm": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "versionNo",
          "locationId",
          "reason",
          "signature"
        ],
        "properties": {
          "versionNo": {
            "$ref": "#/components/schemas/Version"
          },
          "locationId": {
            "$ref": "#/components/schemas/Id"
          },
          "reason": {
            "$ref": "#/components/schemas/Reason"
          },
          "signature": {
            "$ref": "#/components/schemas/Signature"
          }
        }
      },
      "FinishedShipmentCreate": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "shipmentNo",
          "mainBatchId",
          "locationId",
          "quantity",
          "unitId",
          "receivingParty",
          "reason"
        ],
        "properties": {
          "shipmentNo": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "mainBatchId": {
            "$ref": "#/components/schemas/Id"
          },
          "locationId": {
            "$ref": "#/components/schemas/Id"
          },
          "quantity": {
            "$ref": "#/components/schemas/Decimal"
          },
          "unitId": {
            "$ref": "#/components/schemas/Id"
          },
          "receivingParty": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "reason": {
            "$ref": "#/components/schemas/Reason"
          }
        }
      },
      "FinishedConfirm": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "versionNo",
          "reason",
          "signature"
        ],
        "properties": {
          "versionNo": {
            "$ref": "#/components/schemas/Version"
          },
          "reason": {
            "$ref": "#/components/schemas/Reason"
          },
          "signature": {
            "$ref": "#/components/schemas/Signature"
          }
        }
      },
      "FinishedQaDecision": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "mainBatchId",
          "versionNo",
          "decision",
          "releaseBasis",
          "reason",
          "reviewDigest",
          "signature"
        ],
        "properties": {
          "mainBatchId": {
            "$ref": "#/components/schemas/Id"
          },
          "versionNo": {
            "$ref": "#/components/schemas/Version"
          },
          "decision": {
            "enum": [
              "RELEASED",
              "REJECTED"
            ]
          },
          "releaseBasis": {
            "const": "FULL_INSPECTION"
          },
          "reviewDigest": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "supersedesDecisionId": {
            "$ref": "#/components/schemas/Id"
          },
          "reason": {
            "$ref": "#/components/schemas/Reason"
          },
          "signature": {
            "$ref": "#/components/schemas/Signature"
          }
        }
      }
    }
  }
}
